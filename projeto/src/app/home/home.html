<h1>Lista de Atividades</h1>
<!--Por causa do FormsModule o Angular vai gerenciar o submit do formulario-->
<section class="formulario">
    <form (ngSubmit="editando == null? adicionar(): salvar()")>
        <label for="nome">Atividade: </label>
        <!--CRIA UM VÍNCULO DE DUAS COM O TS(ngModel)-->
        <input type="text" id="nome" name="nome" [(ngModel)]="nome" placeholder="Nova Atividade"> 

        <button type="submit">{{editando == null ? "Adicionar" : "Salvar"}}</button>
        <button  (click)="cancelar()">Cancelar</button>
    </form>
</section>
<section>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Atividade</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <!----Vamos começar a fazer a varredura do vetor lista-->
            @for(atividade of lista; track atividade.id){
                <tr>
                    <!-- Vínculo simples entre o HTML e o TS -> Leitura de valores -->
                    <td>{{atividade.id}}</td>
                    <td> {{atividade.nome}} </td>
                    <td>"Editar" | "Excluir"</td>
                </tr>
            }

            @empty{
                <tr colspan="3">Nenhuma atividade cadastrada</tr>

            }

        </tbody>

    </table>

</section>
